receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/agentguard:
    endpoint: http://agentguard-connector:3200
    encoding: json
    headers:
      Authorization: "Bearer ${env:CONNECTOR_KEY}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/agentguard]
